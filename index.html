<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로스트헤이븐 빌드 가이드</title>
<style>

:root{
  --ar:224,57,154; --bgr:14,10,26; --glow:#2a1850; --accentL:#ff8cc6;
  --bg:#0e0a1a; --panel:#17102b; --panel2:#1f1639; --line:#33264f;
  --text:#ece6fa; --muted:#a79bc4; --accent:#e0399a; --purple:#8a63d2; --purple2:#b79df0;
  --good:#7be0a8; --warn:#f2c14e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,var(--glow) 0%,transparent 60%),var(--bg);
  color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;line-height:1.55}
a{color:var(--purple2)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}

/* hero */
.hero{display:flex;gap:22px;align-items:center;padding:26px 0 18px}
.hero img.art{width:150px;height:203px;object-fit:cover;border-radius:14px;border:1px solid var(--line);
  box-shadow:0 0 0 1px #000,0 10px 40px rgba(var(--ar),.25);flex:none}
.hero h1{margin:0;font-size:clamp(26px,4vw,40px);letter-spacing:-.5px}
.hero h1 small{display:block;font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:600;margin-bottom:4px}
.hero p{margin:8px 0 12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel2);border:1px solid var(--line);padding:4px 11px;border-radius:99px;font-size:13px}
.chip b{color:var(--purple2)}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(var(--bgr),.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;padding:8px 16px}
nav a{color:var(--muted);text-decoration:none;padding:6px 13px;border-radius:8px;font-size:14px;white-space:nowrap}
nav a:hover{background:var(--panel2);color:var(--text)}

section{padding:30px 0 6px}
h2{margin:0 0 14px;font-size:22px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--accent),var(--purple))}
.card-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}

/* level picker */
.lvbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.lvbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 0;width:46px;font-size:16px;font-weight:700;cursor:pointer}
.lvbtn:hover{border-color:var(--purple)}
.lvbtn.on{background:linear-gradient(135deg,var(--accent),var(--purple));border-color:transparent;color:#fff}
.change{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:760px){.change{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start}}
.cbox{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cbox h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 9px;border-radius:7px;font-size:14px;font-weight:600;margin:2px 4px 2px 0}
.pill.in{background:rgba(123,224,168,.14);color:var(--good)}
.pill.out{background:rgba(var(--ar),.14);color:var(--accentL)}
.pill.keep{background:rgba(242,193,78,.13);color:var(--warn)}
.handgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--purple)}
.tile img{display:block;width:100%;aspect-ratio:429/600;object-fit:cover;background:#120c22}
.tile .cap{padding:7px 9px 8px;font-size:12.5px}
.tile .cap b{display:block;font-size:13px;line-height:1.25}
.tile .cap span{color:var(--muted)}
.tile.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 6px 24px rgba(var(--ar),.25)}
.badge{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;letter-spacing:.5px}
.gone{margin-top:14px}
.gone .handgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.gone .tile{opacity:.5;filter:grayscale(.7)}
.gone .tile .cap{font-size:11px;padding:4px 6px}
.gone .tile .cap b{font-size:11.5px}

/* matrix */
.mwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:560px;table-layout:fixed;font-size:14px}
th.nm{width:210px}th:nth-child(2){width:44px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
thead th{background:var(--panel2);color:var(--purple2);position:sticky;top:0;font-size:13px;cursor:pointer;user-select:none}
th.nm,td.nm{text-align:left;white-space:nowrap}
td.nm{font-weight:600}
td.lvc{color:var(--muted);font-size:12px}
td.h{background:rgba(138,99,210,.22);color:var(--purple2);font-weight:700}
td.n{background:var(--accent);color:#fff;font-weight:800}
td.m{background:rgba(242,193,78,.1);color:var(--warn)}
th.cur,td.cur{box-shadow:inset 2px 0 0 rgba(var(--ar),.7),inset -2px 0 0 rgba(var(--ar),.7)}
tr.unused td.nm{color:var(--muted);font-weight:400}
.toggle{display:inline-flex;align-items:center;gap:7px;margin:0 0 10px;font-size:14px;color:var(--muted);cursor:pointer}

/* card refs */
.cref{color:var(--purple2);border-bottom:1px dashed var(--purple);cursor:help;font-weight:600;white-space:nowrap}
.cref:hover{color:#fff;border-color:var(--accent)}

/* combos */
.combo{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.combo:last-child{border:0}
.combo .lv{align-self:start;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 0;font-weight:800;color:var(--accent);font-size:14px}
.combo .t{font-weight:700}
.combo .d{color:var(--muted);font-size:14px;margin-top:2px}
.arrow{color:var(--accent);font-weight:800;margin:0 4px}

/* perks */
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.perk{display:flex;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.perk:last-child{border:0}
.perk .rk{width:26px;height:26px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted);flex:none}
.perk.top .rk{background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff}
.perk .tx{flex:1;font-size:14.5px}
.perk .tx i{display:block;font-style:normal;font-size:12px;color:var(--muted)}
.boxes{display:flex;gap:5px;flex:none}
.bx{width:28px;height:28px;border-radius:7px;border:1.5px solid var(--purple);background:transparent;color:var(--purple2);font-weight:700;font-size:12px;cursor:pointer}
.bx.on{background:var(--accent);border-color:var(--accent);color:#fff}
.perk.done .tx{opacity:.5;text-decoration:line-through}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.bar{flex:1;height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));width:0}
.btn{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
.btn:hover{color:var(--text)}
.enh{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
.enh:last-child{border:0}
.enh b{color:var(--purple2)}
.enh span.c{color:var(--muted);font-size:12.5px;grid-column:1/-1}

/* items */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.f{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 13px;font-size:13px;cursor:pointer}
.f.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.item .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .nm{font-weight:700}
.item .no{color:var(--muted);font-size:12.5px}
.tag{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;white-space:nowrap}
.tag.must{background:var(--accent);color:#fff}
.tag.rec{background:rgba(138,99,210,.3);color:var(--purple2)}
.tag.sit{background:rgba(242,193,78,.14);color:var(--warn)}
.tag.no{background:rgba(255,255,255,.08);color:var(--muted)}
.item p{margin:5px 0 0;font-size:14px}
.item p.m{color:var(--muted);font-size:13px}

ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:5px 0}
footer{padding:30px 0 60px;color:var(--muted);font-size:12.5px}

/* floating preview + lightbox */
#pv{position:fixed;z-index:50;pointer-events:none;display:none;width:300px;border-radius:14px;overflow:hidden;
  box-shadow:0 0 0 2px var(--accent),0 20px 60px rgba(0,0,0,.7);background:#120c22}
#pv img{display:block;width:100%}
#lb{position:fixed;inset:0;z-index:60;background:rgba(5,3,12,.86);display:none;align-items:center;justify-content:center;cursor:zoom-out;padding:16px}
#lb img{max-height:92vh;max-width:92vw;border-radius:16px;box-shadow:0 0 0 2px var(--accent),0 20px 80px #000}
/* ---- multi-class additions ---- */
.top{position:sticky;top:0;z-index:30;background:rgba(var(--bgr),.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px;padding:9px 16px;flex-wrap:wrap}
.top a{color:var(--muted);text-decoration:none;font-size:14px}
.top a:hover{color:var(--text)}
.top .brand{font-weight:800;color:var(--text);margin-right:6px}
.top .sep{color:var(--line)}
.top .cur{color:var(--text);font-weight:700}
nav.sub{top:46px}
.homehero{padding:34px 0 8px}
.homehero h1{margin:0;font-size:clamp(26px,4.4vw,42px);letter-spacing:-.5px}
.homehero h1 small{display:block;font-size:13px;letter-spacing:3px;color:var(--accent);font-weight:600;margin-bottom:6px}
.homehero p{color:var(--muted);margin:10px 0 0;max-width:640px}
.classgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;padding:22px 0 10px}
.ctile{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 10px 14px;text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s,box-shadow .15s}
.ctile:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(var(--ar),.18)}
.ctile b{font-size:17px;margin-top:6px}
.ctile .en{font-size:12px;color:var(--muted);letter-spacing:.3px}
.ctile .meta{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.mini{font-size:11.5px;border-radius:99px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.mini.fh{color:#9fd8ff;border-color:#2a4a66}.mini.gh{color:#f2c14e;border-color:#5a4a1c}.mini.jl{color:#ff9d9d;border-color:#663030}
.mini.b{color:var(--purple2)}
.th{position:relative;display:block;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;
  background:radial-gradient(circle at 30% 25%,var(--glow),var(--bg) 85%);box-shadow:0 0 0 2px var(--line),0 6px 20px rgba(0,0,0,.4)}
.th.icon img{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain;filter:invert(.92)}
.th.mat img{position:absolute;max-width:none}
.th.k-gh img{width:calc(var(--s)*3.05);left:calc(var(--s)*-.1);top:calc(var(--s)*-.12)}
.th.k-jl img{width:calc(var(--s)*1.19);left:calc(var(--s)*-.09);top:calc(var(--s)*-.27)}
.ctile:hover .th{box-shadow:0 0 0 2px var(--accent),0 6px 22px rgba(var(--ar),.3)}
.cardsrc{margin-top:26px;font-size:13px;color:var(--muted)}
.crumbhead{display:flex;gap:18px;align-items:center;padding:24px 0 10px}
.crumbhead h1{margin:0;font-size:clamp(24px,4vw,36px);letter-spacing:-.5px}
.crumbhead h1 small{display:block;font-size:12.5px;letter-spacing:3px;color:var(--accent);font-weight:600;margin-bottom:4px;text-transform:uppercase}
.crumbhead p{margin:6px 0 0;color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;padding:14px 0}
.bcard{display:flex;flex-direction:column;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:var(--text);transition:transform .15s,border-color .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 30px rgba(var(--ar),.18)}
.bcard h3{margin:0;font-size:26px;letter-spacing:-.3px;display:flex;align-items:baseline;gap:10px}
.bcard h3 small{font-size:13px;color:var(--purple2);font-weight:600}
.bcard .sum{color:var(--muted);font-size:14.5px;margin:0}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.pc2 ul{margin:4px 0 0;padding-left:16px}.pc2 li{margin:2px 0}
.pc2 b.g{color:var(--good)}.pc2 b.r{color:var(--accentL)}
.bcard .go{margin-top:auto;color:var(--accent);font-weight:700;font-size:14px}
.sw{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 4px}
.swb{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.swb:hover{color:var(--text);border-color:var(--purple)}
.swb.on{background:linear-gradient(135deg,var(--accent),var(--purple));border-color:transparent;color:#fff}
.flags{background:rgba(242,193,78,.08);border:1px solid rgba(242,193,78,.35);border-radius:12px;padding:10px 14px;margin:12px 0 0;font-size:13.5px;color:#f5dd9a}
.flags b{color:var(--warn)}
.flags p{margin:3px 0}
.warn{color:var(--warn);font-size:12.5px;margin:8px 0 0}
.badge.alt{background:var(--purple)}
td.a{background:rgba(138,99,210,.12);color:var(--purple2);font-weight:700}
td.nm small{display:block;color:var(--muted);font-weight:400;font-size:11.5px;white-space:normal}
.pbtn{display:inline-block;margin:0 0 10px;padding:5px 12px;font-size:13px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);color:var(--purple2);cursor:pointer}
.pbtn:hover{border-color:var(--purple);color:#fff}
.bx.dash{opacity:.45;cursor:default;border-style:dashed}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
@media(max-width:560px){.pc2{grid-template-columns:1fr}.crumbhead{align-items:flex-start}}
.bx{width:auto;min-width:28px;padding:0 7px;white-space:nowrap}
.hero{padding-left:16px;padding-right:16px}.homehero,.crumbhead{padding-left:0}

.classgrid.icons{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px;padding:40px 0}
.classgrid.icons .ctile{padding:18px;aspect-ratio:1;justify-content:center;border-color:rgba(var(--tr),.35);background:radial-gradient(circle at 50% 40%,rgba(var(--tr),.22),var(--panel) 75%)}
.classgrid.icons .ctile:hover{border-color:var(--tc);box-shadow:0 10px 30px rgba(var(--tr),.35)}
.classgrid.icons .ctile .th{box-shadow:0 0 0 2px rgba(var(--tr),.6)}
.classgrid.icons .ctile .th{background:radial-gradient(circle at 30% 25%,rgba(var(--tr),.45),#0c0a12 85%)}

.grp{padding-top:26px}.grp .classgrid.icons{padding:14px 0 6px}
h2.gh{font-size:20px;margin:0}h2.gh small{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:600;margin-left:8px}
.th.icon2 img{position:absolute;inset:16%;width:68%;height:68%;object-fit:contain;filter:brightness(0) invert(.92)}

.inf{color:var(--muted);font-size:11px;margin:8px 0 0;opacity:.85;line-height:1.5}
</style>
</head>
<body>
<div class="top"><div class="wrap" id="crumbs"></div></div>
<div id="app"></div>
<footer class="wrap">

ing.png","desc":"하단: 이 라운드 부정 상태 영향 없음 (이니셔티브 99)"},{"en":"Redemption","ko":"","lv":9,"m":".........","img":"character-ability-cards/frosthaven/pc/fh-redemption.png","desc":"반격 같은 지속 피해 (Chained by Spite와 시너지)"}],"notes":{"1":{"head":"Delayed Malady + The Agony of Others 투입","why":"Malady가 핵심 지속 손실, Agony가 화력 카드예요. 5턴짜리 폭발 구간이 이 빌드의 정체성.","tip":"Malady는 이동할 수 없으니 위치를 미리 잡아두세요."},"2":{"head":"Infection Purge 투입 (Swift Vengeance 제외)","why":"Malady 중에는 총 10~12 피해가 나오는 초반 보상 카드예요.","tip":"가이드 본문은 Cleansing Fire를 뺀다고 쓰지만 이후 레벨 핸드 그림은 Cleansing Fire가 남아 있어요 (그림 기준)."},"3":{"head":"Burned at Both Ends 투입 (Pleasure in Pain 제외)","why":"두 번째 소형 슬롯에 자해 포션을 쓸 수 있어 Pleasure in Pain이 필요 없어요.","tip":"자신 무장해제는 Infection Purge(상단)로 돌려 쓰고, 불은 Malady 중에 가치가 커져요."},"4":{"head":"Down to the Dirt 투입 (Transferred Injury 제외)","why":"하단이 Malady 중에는 이동 4 + 회복 4+로 커지고, Purge의 자해를 되돌려줘요.","tip":"공격 폴백으로도 좋아요 (이 빌드는 공격 카드가 적음)."},"5":{"head":"Mirrored Misery 투입 (Cleansing Fire 제외)","why":"Burned 뒤에 무장해제를 이어 전파하고, 한 턴에 두 적에게 상처/중독을 줄 수 있어요.","tip":"Mirrored Misery는 '전달'이 아니라서 같은 턴 공격은 비공격 카드로. 5레벨 카드(이니셔티브 15)는 손실 2개라 일부러 패스."},"6":{"head":"Phantom Limb 투입 (Unstable Effigy 제외)","why":"Effigy의 속박 역할을 Phantom Limb이 대신하고 상단 카드가 늘어 균형이 좋아져요.","tip":"이니셔티브가 더 나빠져요. 이니셔티브 부츠 고려. Malady가 끝난 다음 턴에 Phantom Limb을 쓰는 것도 좋아요."},"7":{"head":"새 카드 없음 (자유 선택)","why":"현재 핸드 카드가 전부 역할이 있어서 새 카드가 들어갈 자리가 없어요.","tip":"마음에 드는 카드를 써보세요. 뺀다면 Mirrored Misery가 가장 만만해요."},"8":{"head":"Wracked with Pain 투입 (Unending Torment 제외)","why":"이니셔티브가 조금 좋고 회복 가능성, 필요할 때 상단 기절. 하단 인챈트한 Torment와 큰 차이는 없어요.","tip":"Torment의 원소 생성이 없어지고 Wracked의 불 소비가 생겨 원소 계획이 더 필요해요."},"9":{"head":"The End of Everything 투입 (Line of Transference 제외)","why":"Malady 구간을 늘려줘요. Malady 중에는 이동 4뿐이라 오히려 약해요.","tip":"Malady를 끝까지 아껴 탈진 시 상단을 쓰면 방 전체 무장해제+상처+중독이 가능해요 (마지막 방에 Malady를 아껴둘 이유)."}},"perks":[{"t":"최대 HP +5","n":"필수","b":["16"]},{"t":"긴 휴식 라운드: 부정 상태 무시 (그 라운드엔 제거도 안 됨)","n":"필수 · 조건 빌드의 핵심","b":["14"]},{"t":"+0 '부정 상태당 +1 공격' 카드 추가","n":"Delayed Malady 빌드에 최고. 가이드가 높은 우선순위 권장","b":["11","12"]},{"t":"-1 카드 2장 제거","n":"","b":["1"]},{"t":"-1 1장 → +0 무장해제 1장","n":"","b":["3"]},{"t":"시나리오 효과 무시 + +1 카드 2장 추가","n":"Brittle로 시작해도 적에게 넘기면 돼서 뒤로 미뤄도 OK","b":["13"]},{"t":"-2 1장 → -2 저주 저주 1장","n":"가이드가 좋아하는 특혜","b":["2"]},{"t":"+1 3장 → +1 저주 3장","n":"","b":["8"]},{"t":"회복 1(자신) 롤링 카드 3장 추가","n":"후순위 · 자해 상처/중독과 안 맞음","b":["9","10"]},{"t":"+0 1장 → +2 1장","n":"","b":["7"]},{"t":"+0 1장 → +1 불/바람 1장","n":"","b":["4","5","6"]},{"t":"탈진 시 먼저 저주(전체, 사거리 3)","n":"","b":["15"]}],"perkMode":"slot","enh":[["Shared Affliction 하단","이동 +1","평생 쓰는 하단. 조건을 목표에 붙일 기회가 늘어요 (우선)"],["Burned at Both Ends 하단","이동 +1","같은 이유로 추천"],["Unending Torment 하단","회복 +1","오래 쓰는 핵심 회복 (상단 선호면 상단)"],["Line of Transference 상단","사거리 +1","다른 카드는 전부 사거리 3 · 속박 전달에 유리"],["Cleansing Fire 하단","이동 +1","저렴한 인챈트 (상황용)"],["Pleasure in Pain 하단","상처 추가","카드 1장으로 상처+중독 · 약 150골드 (다중 대상)"],["Wave of Anguish 하단","중독 또는 속박","한 장에서 자해 상태 확보 · 매우 비쌈 (약 150골드)"],["Reversal of Fate 상단","강화(Strengthen)","반값 · 자기 공격 + 다음 공격에 강화"]],"items":[["must","필수","98","Unhealthy Mixture","소형","자신에게 상처+중독 (소모)","초반 템포. Shared Affliction 가치를 바로 얻어요."],["must","필수","119","Deadly Mixture","소형","상처+중독+속박+무장해제 (소모)","Delayed Malady와 짝. 조건이 많을수록 강해져요."],["must","필수급","120","Amulet of Life","머리","자신 회복 1 (휴식 시 복구)","상처/중독을 원할 때 지우는 용도."],["must","최고","236","Cracked Mirror","소형","손의 카드 1장을 잃고 잃은 카드 중 같거나 낮은 레벨 1장 회복 (소모)","DM 전용. Malady를 10라운드 쓸 수 있게 돼요. 첫 방에 한 번, 두 번째는 가장 위험한 구역에."],["must","추천","244","Ember Energy Source","소형","능력 수치 하나 +1","The Agony of Others의 '조건당 +1'을 +2로. Malady 중 10~12 피해."],["rec","추천","168","Circlet of Eyes","머리","원거리 공격에 목표 +1 (소모)","큰 Agony 공격을 두 대상에게. Disarm 전파에도."],["rec","추천","94 / 111","Frenzy Potion (Major)","소형","공격 2 / 4 (소모)","Malady 중 조건 전파용 추가 공격."],["rec","추천","162","Howling Ice Brooch","소형","얼음/바람 소모: 공격 3 사거리 3 + 속박 (소모)","무장해제 중 공격할 수 있을 때 조건 추가 전파."],["rec","추천","30","Parrying Gauntlet","손","인접해 이동을 끝낸 적에게 공격 3 (소모)","Malady 중 적을 무장해제시켜 이번·다음 턴 공격을 무효화."],["rec","추천","132","Cloak of (Many) Pockets","몸","시작 시 소형 아이템 +1 (Many는 +2)","필수 소형 슬롯 확보."],["rec","추천","125 / 142","Boots of Speed / Quickness","발","이니셔티브 ±10 / ±20","DM은 이니셔티브가 아주 나빠요. 6레벨 이후 특히 고려."],["rec","추천","17","Cured Leather Armor","몸","다음 공격 2번의 공격자가 불리함","-1 카드가 덱에 늘지 않는 방어구."],["must","최고","258","Skull of Agony","소형·솔로","HP 절반 미만이 되면 회복 7, 자신 저주 (소모)","부정 상태에 영향 없는 회복. 최대한 아껴 쓰기."],["sit","무난","83 / 99","Healing Potion (Major)","소형","자신 회복 3 / 6 (소모)","긴 휴식 특혜의 '창'에 쓰면 조건 유지한 채 회복."],["sit","무난","81","Pain Simulacrum","소형","공격으로 5 이하 피해 시 사거리 2 적에게 같은 피해 (소모)","해금 과정에서 이미 갖고 있을 가능성 높음."]],"combos":[["1~5","Unstable Effigy(하, 늦게) → Line of Transference(상)","바람 +2 피해 + 속박 전달. 6레벨에 Effigy가 빠지기 전까지."],["2~","Infection Purge → The Agony of Others","Purge의 불로 Agony 강화. Malady 중에는 10~12 피해."],["3~","Burned at Both Ends(하) → Shared Affliction(하)","자신 무장해제를 적에게 다시 전달. 같은 턴 공격은 Infection Purge(상) 같은 비공격으로."],["6~","Burned at Both Ends(하) → Phantom Limb(상)","무장해제로 공격하고 공유. Malady가 끝난 다음 턴에 Phantom Limb을 쓰는 것도 좋아요."],["9","Phantom Limb(상) + Burned at Both Ends(하) → The Agony of Others(상) + The End of Everything(하)","The End of Everything 덕에 Burned가 만든 불로 Agony를 강화하는 새 콤보."],["Malady","Deadly Mixture를 Malady 전 턴에 먼저 사용","조건이 많이 쌓인 구간이 길어져요. 이때 Infection Purge가 좋아요."]],"tips":[["Malady 이후 턴","Malady가 끝난 다음 턴에 상처·중독·무장해제·속박이 한꺼번에 남아요. 미리 계획하세요."],["Malady 해제","활성 중에는 언제든 손실로 보낼 수 있어요. 마지막 턴에 해제하면 무장해제/속박을 지울 수 있어요."],["타이밍","아껴둘 때와 바로 쓸 때를 판단하세요. 손실 2개 전부 걱정 마세요, 가이드는 '괜찮다'고 해요."],["Muddle","Unending Torment 하단이 유일한 Muddle 공급원. 조건 하나가 더 필요할 때 쓰세요."],["상처 + 중독","상처는 HP를 깎고 중독은 다음 회복을 막아요. 회복은 휴식 전·후 턴에 몰아서, Amulet of Life로 필요할 때 지워요."],["속박","Line of Transference 상단으로 적에게 넘기면 단점이 없어요. 못 넘기는 상황이면 움직일 일 없는 턴을 계획하세요."]],"flags":[]},{"id":"des","name":"DES","sub":"Chained by Despair","summary":"공격 대신 무장해제·속박·큰 회복으로 적의 공격을 막는 컨트롤 탱커 빌드.","pros":{"enjoy":["적을 계속 묶어두기","전위에서 싸우기 (탱커 느낌)","원할 때 부정 상태 사용"],"works":["컨트롤이 도움 되는 팀","전위가 필요한 팀"],"weak":["사실상 근접 (근접 아군과 겹침)", amina Potion 추천. 보스(무장해제 면역)에게도 효과적."},"8":{"head":"Wave of Anguish 투입 (Transferred Injury 제외)","why":"더 강한 공격 + 전달 효과가 둘이 되어 컨트롤이 늘어요. Bane+속박을 동시에 전달.","tip":"명중해야 전달돼요. Precision Potion(110)으로 위험을 줄이세요."},"9":{"head":"Wracked with Pain 투입 (Unending Torment 제외)","why":"원거리 기절이 이 빌드가 원하는 효과예요. 레벨 9 카드는 도움이 안 돼요.","tip":"이동이 더 필요하면 Cleansing Fire를 남기고 Torment를 빼도 돼요. 이 시점에 휴식당 5~7번의 무장해제/속박."}},"perks":[{"t":"최대 HP +5","n":"필수","b":["16"]},{"t":"긴 휴식 라운드: 부정 상태 무시 (그 라운드엔 제거도 안 됨)","n":"필수 · 조건 빌드의 핵심","b":["14"]},{"t":"-1 카드 2장 제거","n":"","b":["1"]},{"t":"-1 1장 → +0 무장해제 1장","n":"","b":["3"]},{"t":"시나리오 효과 무시 + +1 카드 2장 추가","n":"Brittle로 시작해도 적에게 넘기면 돼서 뒤로 미뤄도 OK","b":["13"]},{"t":"-2 1장 → -2 저주 저주 1장","n":"가이드가 좋아하는 특혜","b":["2"]},{"t":"+1 3장 → +1 저주 3장","n":"","b":["8"]},{"t":"회복 1(자신) 롤링 카드 3장 추가","n":"","b":["9","10"]},{"t":"+0 1장 → +2 1장","n":"","b":["7"]},{"t":"+0 1장 → +1 불/바람 1장","n":"","b":["4","5","6"]},{"t":"탈진 시 먼저 저주(전체, 사거리 3)","n":"","b":["15"]},{"t":"+0 '부정 상태당 +1 공격' 카드 추가","n":"약함 (Despair는 조건이 적음)","b":["11","12"]}],"perkMode":"slot","enh":[["Shared Affliction 하단","이동 +1","평생 쓰는 하단. 조건을 목표에 붙일 기회가 늘어요 (우선)"],["Burned at Both Ends 하단","이동 +1","같은 이유로 추천"],["Unending Torment 하단","회복 +1","오래 쓰는 핵심 회복 (상단 선호면 상단)"],["Line of Transference 상단","사거리 +1","다른 카드는 전부 사거리 3 · 속박 전달에 유리"],["Cleansing Fire 하단","이동 +1","저렴한 인챈트 (상황용)"],["Reversal of Fate 상단","강화(Strengthen)","반값 · 자기 공격 + 다음 공격에 강화"]],"items":[["must","필수","125 / 142","Boots of Speed / Quickness","발","이니셔티브 ±10 / ±20","가이드: '이 빌드엔 이니셔티브 부츠가 없으면 후회한다'."],["must","최고","258","Skull of Agony","소형·솔로","HP 절반 미만이 되면 회복 7, 자신 저주 (소모)","거의 안 맞아서 자해 걱정이 적은 빌드. 위기 시 회복."],["must","추천","84 / 100","Stamina Potion (Major)","소형","버린 카드 회복 (Major는 아무 레벨, 소모)","6레벨에 Item 100 추천. Reject the Gift를 최대한 자주 쓰려고."],["rec","추천","25","Soothing Scepter","손","아군 1명에게 재생(Regenerate) (휴식 시 복구)","적 공격을 많이 막아서 재생이 오래 유지돼요."],["rec","8레벨~","93 / 110","Glancing / Precision Potion","소형","null 카드를 +0 / +2로 취급 (소모)","Wave of Anguish 명중 보장. 가이드가 Precision(110) 추천."],["rec","8레벨~","1","Spyglass","머리","공격 하나에 이점 (휴식 시 복구)","Wave 대안."],["sit","무난","132","Cloak of (Many) Pockets","몸","시작 시 소형 아이템 +1 (Many는 +2)","소형 슬롯 확보."],["sit","무난","17","Cured Leather Armor","몸","다음 공격 2번의 공격자가 불리함","-1이 늘지 않는 방어구. 이 빌드는 약간의 -1은 감수해도 돼요."],["rec","추천","97 / 118","Explosive Vial / Fulminant Flask","소형","사거리 2 적 1명에게 피해 2 / 4 (소모)","직접 피해는 고통전달자의 강점."],["sit","무난","83 / 99","Healing Potion (Major)","소형","자신 회복 3 / 6 (소모)","긴 휴식 특혜의 '창'에 쓰면 조건 유지한 채 회복."],["sit","무난","81","Pain Simulacrum","소형","공격으로 5 이하 피해 시 사거리 2 적에게 같은 피해 (소모)","해금 과정에서 이미 갖고 있을 가능성 높음."],["sit","상황","87 / 103","Cure Potion (Major)","소형","부정 상태 1개(전체) 제거 (소모)","속박/무장해제가 불편할 때."],["sit","상황","104","Swiftness Potion","소형","이동 +3, 점프 (소모)","카드로는 점프가 없어요."]],"combos":[["3~","Burned at Both Ends(하) → Shared Affliction(하)","무장해제를 적에게 다시 전달. Burned 상단의 불은 Cleansing Fire/Unending Torment 상단으로."],["5~","Chained by Despair로 상태 획득 → Mirrored Misery(하)","Poison → 무장해제 → Wound 순으로 쌓아 한 번에 전달 (Wound, Poison, Disarm 동시 공유)."],["6~","Burned at Both Ends(하) → Hopelessness(상) + Mirrored Misery(상)","Mirrored Misery로 무장해제를 공유하면 공격을 못 하니 Hopelessness를 상단으로."],["7~","Reject the Gift(상) + Hopelessness(하)","큰 이동을 하면서 Bane 피해를 인접 적에게 반사 (공짜 이동)."],["8~","1턴: Reject the Gift(상)+Burned at Both Ends(하)\n2턴: Despair로 중독/상처 → Hopelessness(상)+Mirrored Misery(하)\n3턴: Despair로 속박 → Wave of Anguish(상)+Shared Affliction(하)\n4턴: Despair로 속박 → Line of Transference(상)","가이드의 8레벨 카드 순서 예시. 바람 소비·전달·무장해제 회피를 동시에 맞춰요."]],"tips":[["Despair 사용","1턴차 대부분 시나리오에서 상단으로 내보내요. 무장해제/속박뿐 아니라 상처/중독도 원할 때 가능해요."],["함정","Line 상단(속박 전달)과 Shared Affliction 하단(무장해제 전달)을 같은 턴에 쓰면, 인접해 있지 않으면 공격을 못 해요."],["긴 휴식","휴식 중에도 자신에게 상태를 걸어 미리 준비할 수 있어요."],["참고","Despair로 조건을 쌓아 Swift Vengeance/Infection Purge를 쓰는 방식은 '품에 비해 보상이 적다'고 해요 (그러려면 Delayed Malady가 낫다)."]],"flags":[]},{"id":"sp","name":"SP","sub":"Shared Pain","summary":"큰 반격(Retaliate 5+) 턴과 직접 피해로 싸우는 탱커 빌드. 거의 공격하지 않아요.","pros":{"enjoy":["거의 공 figy는 하단과 이니셔티브만 쓰던 카드라 쉬운 교체. 이동이 줄어드는 게 아쉬워요.","tip":"Reprisal(상)+Penance(하)가 기존 콤보, Penance(상)+Reprisal(하)가 최소 5 피해의 백업 플랜."},"8":{"head":"Reject the Gift 투입 (Line of Transference 제외)","why":"피해를 막으면서 주는 방어 카드. 회복 카드를 남기려고 Line을 뺐어요.","tip":"Bane 전달이 Shared Affliction 하단뿐이라 Disarm을 못 쓸 수 있어요. Cleansing Fire를 빼도 합리적. Reversal의 하단이 한 번 안 터지는 점 주의."},"9":{"head":"Redemption 투입 (Reversal of Fate 제외)","why":"Chained by Spite 상단과 이중 손실로 매 턴 최대 5 직접 피해. 같은 피해를 2 덜 아프게 줄 수 있어요.","tip":"10장 중 손실 2개도 괜찮다고 가이드가 말해요. 더 많이 맞고 싶어지는 카드."}},"perks":[{"t":"최대 HP +5","n":"필수","b":["16"]},{"t":"긴 휴식 라운드: 부정 상태 무시 (그 라운드엔 제거도 안 됨)","n":"필수 · 조건 빌드의 핵심","b":["14"]},{"t":"-1 카드 2장 제거","n":"","b":["1"]},{"t":"-1 1장 → +0 무장해제 1장","n":"","b":["3"]},{"t":"시나리오 효과 무시 + +1 카드 2장 추가","n":"Brittle로 시작해도 적에게 넘기면 돼서 뒤로 미뤄도 OK","b":["13"]},{"t":"-2 1장 → -2 저주 저주 1장","n":"가이드가 좋아하는 특혜","b":["2"]},{"t":"+1 3장 → +1 저주 3장","n":"","b":["8"]},{"t":"회복 1(자신) 롤링 카드 3장 추가","n":"","b":["9","10"]},{"t":"+0 1장 → +2 1장","n":"","b":["7"]},{"t":"+0 1장 → +1 불/바람 1장","n":"","b":["4","5","6"]},{"t":"탈진 시 먼저 저주(전체, 사거리 3)","n":"Shared Pain은 후반에 공격이 필요 없어서 가이드가 좀 더 우선시할 만하다고 함","b":["15"]},{"t":"+0 '부정 상태당 +1 공격' 카드 추가","n":"약함","b":["11","12"]}],"perkMode":"slot","enh":[["Scarred Effigy 하단 + Reprisal 상단","반격 +1","Shared Pain 빌드는 반드시 노릴 인챈트. 가격은 비싸지만 피해가 확실히 늘어요"],["Shared Affliction 하단","이동 +1","평생 쓰는 하단. 조건을 목표에 붙일 기회가 늘어요 (우선)"],["Burned at Both Ends 하단","이동 +1","같은 이유로 추천"],["Unending Torment 하단","회복 +1","오래 쓰는 핵심 회복 (상단 선호면 상단)"],["Line of Transference 상단","사거리 +1","다른 카드는 전부 사거리 3 · 속박 전달에 유리"],["Cleansing Fire 하단","이동 +1","저렴한 인챈트 (상황용)"],["Reversal of Fate 상단","강화(Strengthen)","반값 · 자기 공격 + 다음 공격에 강화"]],"items":[["must","최고","258","Skull of Agony","소형·솔로","HP 절반 미만이 되면 회복 7, 자신 저주 (소모)","피해를 많이 받는 빌드의 안전망."],["rec","추천","13","Dancing Slippers","발","공격 피해를 받은 뒤 이동 2 (휴식 시 복구)","원거리 공격에도 반격을 발동시킬 수 있어요. 이니셔티브 부츠와 둘 다 챙기면 상황 대응 가능."],["rec","추천","47","Robes of Doom","몸","다음 2번의 공격 피해: 3 피해를 받고 공격에 Brittle (휴식 const RAW = "https://raw.githubusercontent.com/any2cards/worldhaven/master/images/";
const CDN = "https://cdn.jsdelivr.net/gh/any2cards/worldhaven@master/images/";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function setImg(img,path){
  img.dataset.fb=""; img.onerror=()=>{ if(!img.dataset.fb){ img.dataset.fb="1"; img.src=CDN+path;} else { img.style.opacity=.2; } };
  img.src=RAW+path;
}
function fixImgs(root){ root.querySelectorAll("img[data-p]").forEach(i=>setImg(i,i.dataset.p)); }

/* thumbs */
function thumb(c,size){
  const t=c.thumb;
  if(t.t==="data") return `<span class="th icon2" style="--s:${size}px"><img alt="" src="${t.u}"></span>`;
  if(t.t==="icon") return `<span class="th icon" style="--s:${size}px"><img alt="" data-p="${t.u}"></span>`;
  return `<span class="th mat k-${t.k}" style="--s:${size}px"><img alt="" data-p="${t.u}"></span>`;
}

/* ---------- build helpers ---------- */
const IN = "h12NT";
const inHand = (c,l)=> IN.includes(c.m[l-1]);
const MARK = {h:"ㅇ",p:"△","1":"①","2":"②",N:"N",T:"T"};
function handCount(B,l){
  let h=0,n1=0,n2=0,nN=0,nT=0;
  for(const c of B.cards){ const m=c.m[l-1]; if(m==="h")h++; else if(m==="1")n1++; else if(m==="2")n2++; else if(m==="N")nN++; else if(m==="T")nT++; }
  return {n:h+Math.max(n1,n2)+Math.max(nN,nT), alt:(n1+n2+nN+nT)>0};
}

let C,B,LV=1,PERKS={},FIL="all";
let BY_NAME={},nameRe=null;
function prep(){
  BY_NAME={};
  B.cards.forEach(c=>{ BY_NAME[c.en]=c; if(c.ko) BY_NAME[c.ko]=c; });
  const names=Object.keys(BY_NAME).sort((a,b)=>b.length-a.length);
  nameRe=new RegExp("("+names.map(n=>n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join("|")+")","g");
}
const link = t => esc(t).replace(nameRe,m=>`<span class="cref" data-card="${BY_NAME[m].img}">${m}</span>`);
const lvText = t => link(t).replace(/→/g,'<span class="arrow">→</span>').replace(/\n/g,'<br>');
const used = c => /[^.]/.test(c.m);

/* ---------- routing ---------- */
function applyTheme(hex){
  const r=document.documentElement.style;
  if(!hex){["--bg","--panel","--panel2","--line","--text","--muted","--accent","--purple","--purple2","--ar","--bgr","--glow","--accentL"].forEach(k=>r.removeProperty(k));return;}
  const n=parseInt(hex.slice(1),16), R=n>>16&255,G=n>>8&255,Bl=n&255;
  const mx=Math.max(R,G,Bl)/255,mn=Math.min(R,G,Bl)/255,d=mx-mn; let h=0;
  if(d){ if(mx===R/255)h=((G-Bl)/255/d)%6; else if(mx===G/255)h=(Bl-R)/255/d+2; else h=(R-G)/255/d+4; h=Math.round(h*60); if(h<0)h+=360; }
  const hsl=(hh,s,l)=>`hsl(${(hh+360)%360} ${s}% ${l}%)`;
  const rgb=(hh,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=k=>{const q=(k+hh/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(q-3,9-q,1))))};return f(0)+","+f(8)+","+f(4)};
  r.setProperty("--accent",hex); r.setProperty("--ar",R+","+G+","+Bl);
  r.setProperty("--accentL",hsl(h,80,75)); r.setProperty("--purple",hsl(h+22,55,52)); r.setProperty("--purple2",hsl(h+10,75,78));
  r.setProperty("--bg",hsl(h,38,6)); r.setProperty("--bgr",rgb(h,38,6)); r.setProperty("--panel",hsl(h,32,10)); r.setProperty("--panel2",hsl(h,30,14));
  r.setProperty("--line",hsl(h,26,23)); r.setProperty("--glow",hsl(h,55,17)); r.setProperty("--text",hsl(h,30,93)); r.setProperty("--muted",hsl(h,16,68));
}

function route(){
  const p=location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(!p.length) return renderHome();
  C=CLASSES.find(x=>x.id===p[0]);
  if(!C) return renderHome();
  applyTheme(C.color);
  if(p[1]){ B=C.builds.find(b=>b.id===p[1]); if(B) return renderBuild(); }
  if(C.builds.length===1){ location.replace(`#/${C.id}/${C.builds[0].id}`); return; }
  renderClass();
}
function crumbs(parts){
  $("#crumbs").innerHTML = `<a class="brand" href="#/">⛓ 빌드 가이드</a>` + parts.map(([t,h],i)=> `<span class="sep">›</span>` + (h?`<a href="${h}">${esc(t)}</a>`:`<span class="cur">${esc(t)}</span>`)).join("");
}

/* ---------- HOME ---------- */
function renderHome(){
  applyTheme(null); crumbs([]);
  document.title="프로스트헤이븐 빌드 가이드";
  const GR=[["fh","프로스트헤이븐","Frosthaven"],["gh","글룸헤이븐","Gloomhaven"],["jl","죠스 오브 더 라이온","Jaws of the Lion"]];
  const tile=c=>`<a class="ctile" href="#/${c.id}" title="${esc(c.ko)} · ${esc(c.en)}" aria-label="${esc(c.ko)}" style="--tc:${c.color};--tr:${c.rgb}">${thumb(c,104)}</a>`;
  $("#app").innerHTML = `<main class="wrap">${GR.map(([k,ko,en])=>{const L=CLASSES.filter(c=>c.pre===k); return L.length?`<section class="grp"><h2 class="gh ${k}">${ko} <small>${en}</small></h2><div class="classgrid icons">${L.map(tile).join("")}</div></section>`:"";}).join("")}</main>`;
  fixImgs($("#app"));
}

/* ---------- CLASS (build list) ---------- */
function renderClass(){
  crumbs([[C.ko]]);
  document.title=C.ko+" · 빌드 가이드";
  const big = C.id==="pc" ? `<img alt="" src="${ART}" style="width:110px;height:149px;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 40px rgba(224,57,154,.25)">` : thumb(C,110);
  $("#app").innerHTML = `<main class="wrap">
   <div class="crumbhead">${big}<div><h1><small>${esc(C.en)}</small>${esc(C.ko)}</h1><p>빌드를 골라 보세요.</p></div></div>
   <div class="bgrid">${C.builds.map(b=>{
     const pr = b.pros ? `<div class="pc2"><div><b class="g">잘 맞는 점</b><ul>${b.pros.enjoy.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div><div><b class="r">주의할 점</b><ul>${b.pros.weak.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "";
     return `<a class="bcard" href="#/${C.id}/${b.id}"><h3>${esc(b.name)} <small>${esc(b.sub)}</small></h3>${b.summary?`<p class="sum">${esc(b.summary)}</p>`:""}${pr}<span class="go">이 빌드 보기 →</span></a>`;
   }).join("")}</div></main>`;
  fixImgs($("#app"));
}

/* ---------- BUILD PAGE ---------- */
const hasItems=()=>B.items.length, hasCombos=()=>B.combos.length, hasTips=()=>B.tips.length;
function renderBuild(){
  prep();
  const key=C.id+"_"+B.id;
  LV = store("fgw_lv_"+key) || 1; PERKS = store("fgw_pk_"+key) || {}; FIL="all";
  document.title=`${C.ko} · ${B.name} · 빌드 가이드`;
  crumbs(C.builds.length>1 ? [[C.ko,"#/"+C.id],[B.name]] : [[C.ko]]);
  const nav=[["hand","레벨별 핸드"],["matrix","레벨표"]];
  if(hasCombos()) nav.push(["combo","콤보"]);
  nav.push(["perk","특혜·인챈트"]);
  if(hasItems()) nav.push(["items","아이템"]);
  if(hasTips()||C.id==="pc") nav.push(["tips","팁"]);
  const head = C.id==="pc"
   ? `<img class="art" alt="" src="${ART}">`
   : thumb(C,110);
  $("#app").innerHTML = `
  <header class="wrap hero">${head}
    <div><h1><small>${esc(C.en)} · ${esc(B.sub||B.name)}</small>${esc(C.ko)} · ${esc(B.name)}</h1>
      ${B.summary?`<p>${esc(B.summary)}</p>`:""}
      ${C.builds.length>1?`<div class="sw">${C.builds.map(b=>`<a class="swb ${b.id===B.id?'on':''}" href="#/${C.id}/${b.id}">${esc(b.name)}</a>`).join("")}</div>`:""}
      ${B.flags.length?`<div class="flags"><b>원본 시트 메모</b>${B.flags.map(f=>`<p>· ${esc(f)}</p>`).join("")}</div>`:""}
    </div></header>
  <nav class="sub"><div class="wrap">${nav.map(([i,t])=>`<a href="#" data-go="${i}">${t}</a>`).join("")}</div></nav>
  <main class="wrap">
   <section id="hand"><h2>레벨별 핸드</h2><div class="card-panel">
     <div class="lvbar" id="lvbar"></div><div class="change" id="change"></div><div class="handgrid" id="handgrid"></div><div class="gone" id="gone"></div></div></section>
   <section id="matrix"><h2>한눈에 레벨표</h2>
     <label class="toggle"><input type="checkbox" id="showAll"> 이 빌드에서 안 쓰는 카드도 보기</label>
     <div class="mwrap"><table id="mtable"></table></div>
     <p class="hint" style="margin-top:8px">ㅇ 핸드 포함 · <b style="color:#ff8cc6">분홍 칸</b> 그 레벨에 새로 투입 · △ 받았지만 핸드엔 안 넣음 · ①②·N·T는 택1 표시 · 레벨 숫자를 누르면 위 핸드가 바뀌어요.</p></section>
   ${hasCombos()?`<section id="combo"><h2>핵심 콤보</h2><div class="card-panel" id="combos"></div></section>`:""}
   <section id="perk"><h2>특혜 · 인챈트</h2><div class="two">
     <div class="card-panel">
       <div class="prog"><b>특혜</b><div class="bar"><i id="pbar"></i></div><span id="ptxt"></span><button class="btn" id="preset">초기화</button></div>
       <button class="pbtn" id="pimg">공식 특혜 시트 이미지 보기 (프로스트헤이븐판)</button>
       <p class="hint" id="phint"></p><div id="perks"></div></div>
     <div class="card-panel"><b>능력카드 향상 (인챈트)</b>
       <p class="hint">${C.id==="pc"?'가이드: "꼭 필요한 인챈트는 없음". 점프는 비추천.':(C.guide?'가이드에 적힌 인챈트 추천이에요.':'원본 엑셀 시트에 적힌 인챈트 계획이에요.')}</p><div id="enh"></div></div></div></section>
   ${hasItems()?`<section id="items"><h2>추천 아이템</h2><div class="filters" id="filters"></div><div class="items" id="itemgrid"></div></section>`:""}
   ${(hasTips()||C.id==="pc")?`<section id="tips"><h2>팁${C.id==="pc"?" · 3인 파티":""}</h2><div class="two">
     ${hasTips()?`<div class="card-panel"><b>플레이 팁</b><ul class="clean" id="tipl"></ul></div>`:""}
     ${C.id==="pc"?`<div class="card-panel"><b>3인 파티 메모</b> <span class="muted" style="font-size:12px">(가이드 외 의견)</span><ul class="clean">
        <li>조건(상처·중독 등) 빌드는 <b>전위 탱커 아군</b>이 있을 때 편해요. 파티에 전위가 있는지 먼저 확인!</li>
        <li>상처·중독을 많이 거는 파티원이 있으면 조건 빌드와 겹쳐요.</li>
        <li>전위가 없다면 DES(제어) / SP(탱킹) 빌드도 대안이에요.</li>
        <li>가이드에 3인 전용 조언은 따로 없어요.</li></ul></div>`:""}
   </div></section>`:""}
  </main>`;
  wireBuild();
  fixImgs($("#app"));
  setTimeout(()=>B.cards.filter(used).forEach(c=>{ const i=new Image(); i.src=RAW+c.img; }),700);
}

function wireBuild(){
  $("#lvbar").innerHTML=[1,2,3,4,5,6,7,8,9].map(l=>`<button class="lvbtn" data-lv="${l}">${l}</button>`).join("");
  $("#lvbar").addEventListener("click",e=>{ const b=e.target.closest(".lvbtn"); if(b){ LV=+b.dataset.lv; renderLv(); }});
  $("#showAll").addEventListener("change",renderMatrix);
  $("#mtable").addEventListener("click",e=>{ const t=e.target.closest("th[data-lv]"); if(t){ LV=+t.dataset.lv; renderLv(); $("#hand").scrollIntoView({behavior:"smooth"}); }});
  document.querySelectorAll("nav.sub a").forEach(a=>a.addEventListener("click",e=>{ e.preventDefault(); document.getElementById(a.dataset.go).scrollIntoView({behavior:"smooth"}); }));
  if(hasCombos()) $("#combos").innerHTML=B.combos.map(([lv,t,d])=>`<div class="combo"><div class="lv">Lv ${esc(lv)}</div><div><div class="t">${lvText(t)}</div><div class="d">${lvText(d)}</div></div></div>`).join("");
  $("#enh").innerHTML=B.enh.length ? B.enh.map(([c,e,r])=>`<div class="enh"><span>${lvText(c)}</span><b>${esc(e)}</b>${r?`<span class="c">${esc(r)}</span>`:""}</div>`).join("") : `<div class="empty">이 빌드에는 정리된 인챈트 계획이 없어요.</div>`;
  $("#pimg").addEventListener("click",()=>{ setImg(lbi,C.perkimg); lb.style.display="flex"; });
  $("#perks").addEventListener("click",e=>{ const b=e.target.closest(".bx"); if(b&&!b.classList.contains("dash")){ const k=b.dataset.k; PERKS[k]=!PERKS[k]; store("fgw_pk_"+C.id+"_"+B.id,PERKS); renderPerks(); }});
  $("#preset").addEventListener("click",()=>{ if(confirm("체크한 특혜를 모두 지울까요?")){ PERKS={}; store("fgw_pk_"+C.id+"_"+B.id,PERKS); renderPerks(); }});
  if(hasItems()){
    const F=[["all","전체"],["must","필수·최고"],["rec","추천"],["sit","상황별"],["no","비추"]];
    $("#filters").innerHTML=F.map(([k,l])=>`<button class="f ${k==='all'?'on':''}" data-f="${k}">${l}</button>`).join("");
    $("#filters").addEventListener("click",e=>{ const b=e.target.closest(".f"); if(b){ FIL=b.dataset.f; renderItems(); }});
    renderItems();
  }
  if(hasTips()) $("#tipl").innerHTML=B.tips.map(([a,b])=>`<li><b>${esc(a)}</b> — ${lvText(b)}</li>`).join("");
  renderMatrix(); renderLv(); renderPerks();
}

/* ---- level / hand ---- */
function renderLv(){
  document.querySelectorAll(".lvbtn").forEach(b=>b.classList.toggle("on",+b.dataset.lv===LV));
  const hand=B.cards.filter(c=>inHand(c,LV));
  const added = LV>1 ? hand.filter(c=>!inHand(c,LV-1)) : [];
  const removed = LV>1 ? B.cards.filter(c=>inHand(c,LV-1)&&!inHand(c,LV)) : [];
  const kept = B.cards.filter(c=>c.m[LV-1]==="p");
  const note = B.notes[LV];
  const nm = c=> c.ko ? `${c.ko}` : c.en;
  const pills=(arr,cls,empty)=> arr.length ? arr.map(c=>`<span class="pill ${cls}"><span class="cref" data-card="${c.img}" style="border:0;color:inherit">${esc(c.en)}</span></span>`).join("") : `<span class="muted">${empty}</span>`;
  const hc=handCount(B,LV), h1=handCount(B,1).n;
  const head = note ? note.head : (LV===1?"시작 핸드":`새 카드 ${added.length}장 · 빠짐 ${removed.length}장`);
  let right;
  if(note){ right=`<h4>주의 / 팁</h4><p style="margin:0;font-size:14.5px">${lvText(note.tip||"")}</p>`; }
  else { right=`<h4>메모</h4><p class="muted" style="margin:0;font-size:14px">이 레벨에는 따로 적어 둔 설명이 없어요. 위 카드 변화만 보여줘요.</p>`; }
  const warn = (!B.partial && hc.n!==h1 && !B.notes[1]) ? `<p class="warn">⚠ 이 레벨은 시트에 ${hc.n}장만 적혀 있어요 (1레벨은 ${h1}장). 원본이 덜 채워졌을 수 있어요.</p>` : "";
  $("#change").innerHTML=`
   <div class="cbox"><h4>Lv ${LV} · ${esc(head)}</h4>
     <div>${pills(added,"in",LV===1?"":"새로 넣는 카드 없음")}</div>
     <div style="margin-top:2px">${removed.length?'<span class="muted" style="font-size:12px">빠짐 </span>'+pills(removed,"out",""):""}</div>
     ${kept.length?`<div style="margin-top:2px"><span class="muted" style="font-size:12px">받았지만 핸드엔 안 넣음 </span>${pills(kept,"keep","")}</div>`:""}
     ${note?`<p style="margin:10px 0 0;font-size:14px">${lvText(note.why)}</p>`:""}</div>
   <div class="cbox">${right}<p class="muted" style="margin:10px 0 0;font-size:12.5px">핸드 ${hc.n}장${hc.alt?" (택1 카드 포함)":""} · 카드를 누르면 크게 볼 수 있어요</p>${warn}${B.inf?`<p class="inf">${esc(B.inf)}</p>`:""}</div>`;
  const tile=(c,isNew)=>{ const m=c.m[LV-1], alt = "12NT".includes(m)?MARK[m]:"";
    return `<div class="tile ${isNew?'new':''}" data-card="${c.img}" data-open="1">${isNew?`<span class="badge">NEW${alt?" "+alt:""}</span>`:(alt?`<span class="badge alt">${alt}</span>`:"")}<img alt="${esc(c.en)}" data-p="${c.img}"><div class="cap"><b>${esc(c.en)}</b><span>${c.ko?esc(c.ko)+" · ":""}Lv ${c.lv}</span></div></div>`; };
  $("#handgrid").innerHTML = hand.length ? hand.map(c=>tile(c,added.includes(c))).join("") : `<div class="empty">이 레벨에 핸드로 표시된 카드가 없어요.</div>`;
  $("#gone").innerHTML = removed.length ? `<h4 class="muted" style="margin:0 0 8px;font-size:13px;font-weight:600">이 레벨에 빠진 카드</h4><div class="handgrid">${removed.map(c=>tile(c,false)).join("")}</div>` : "";
  fixImgs($("#handgrid")); fixImgs($("#gone"));
  document.querySelectorAll("#mtable .cur").forEach(e=>e.classList.remove("cur"));
  document.querySelectorAll(`#mtable [data-col="${LV}"]`).forEach(e=>e.classList.add("cur"));
  store("fgw_lv_"+C.id+"_"+B.id,LV);
}

/* ---- matrix ---- */
function renderMatrix(){
  const all=$("#showAll").checked;
  const rows=B.cards.filter(c=>all||used(c));
  let h=`<thead><tr><th class="nm">카드</th><th>Lv</th>${[1,2,3,4,5,6,7,8,9].map(l=>`<th data-lv="${l}" data-col="${l}">${l}</th>`).join("")}</tr></thead><tbody>`;
  for(const c of rows){
    h+=`<tr class="${used(c)?'':'unused'}"><td class="nm"><span class="cref" data-card="${c.img}">${esc(c.en)}</span>${c.ko?`<small>${esc(c.ko)}</small>`:""}</td><td class="lvc">${c.lv}</td>`;
    for(let l=1;l<=9;l++){
      const m=c.m[l-1]; let cls="",t="";
      if(m!=="."){ t=MARK[m]; cls = m==="p"?"m":("12NT".includes(m)?"a":"h"); if(m!=="p" && l>1 && !inHand(c,l-1)) cls="n"; }
      h+=`<td class="${cls}" data-col="${l}">${t}</td>`;
    }
    h+="</tr>";
  }
  $("#mtable").innerHTML=h+"</tbody>";
  document.querySelectorAll(`#mtable [data-col="${LV}"]`).forEach(e=>e.classList.add("cur"));
}

/* ---- perks ---- */
function renderPerks(){
  const slot=B.perkMode==="slot";
  $("#phint").textContent = slot ? "칸 번호는 캐릭터 시트 특혜 칸을 위→아래로 센 번호예요 (위가 우선순위). 누르면 체크돼요 (이 브라우저에 저장)."
                                 : "칸의 숫자는 원본 시트에 적힌 '찍는 순서'예요 (1번부터). 숫자가 없는 줄은 순서를 정하지 않은 특혜예요. 누르면 체크돼요 (이 브라우저에 저장).";
  let total=0,done=0;
  $("#perks").innerHTML=B.perks.map((p,i)=>{
    const labs=p.b.length?p.b:["–"];
    const real=p.b.length>0;
    const keys=labs.map((l,j)=>i+":"+j);
    const all=real && keys.every(k=>PERKS[k]);
    if(real) keys.forEach(k=>{ total++; if(PERKS[k]) done++; });
    const rk = slot ? i+1 : (real ? (String(p.b[0]).match(/\d+/)||["·"])[0] : "·");
    return `<div class="perk ${real&&i<2&&slot?'top':''} ${(!slot&&real&&+rk<=3)?'top':''} ${all?'done':''}"><div class="rk">${rk}</div>
      <div class="tx">${esc(p.t)}${p.n?`<i>${esc(p.n)}</i>`:""}</div>
      <div class="boxes">${labs.map((l,j)=>`<button class="bx ${real?'':'dash'} ${PERKS[keys[j]]?'on':''}" data-k="${keys[j]}" title="${slot?'시트 '+l+'번 칸':'찍는 순서 '+l}">${esc(l)}</button>`).join("")}</div></div>`;
  }).join("");
  $("#pbar").style.width=(total?done/total*100:0)+"%";
  $("#ptxt").textContent=done+"/"+total;
}

/* ---- items ---- */
function renderItems(){
  $("#itemgrid").innerHTML=B.items.filter(i=>FIL==="all"||i[0]===FIL||(FIL==="must"&&i[0]==="must")).map(([k,lab,no,nm,slot,ef,memo])=>
   `<div class="item"><div class="top"><div><span class="nm">${esc(nm)}</span> <span class="no">#${esc(no)} · ${esc(slot)}</span></div><span class="tag ${k}">${esc(lab)}</span></div><p>${esc(ef)}</p><p class="m">${lvText(memo)}</p></div>`).join("");
  document.querySelectorAll(".f").forEach(b=>b.classList.toggle("on",b.dataset.f===FIL));
}

/* ---- hover preview + lightbox ---- */
const pv=$("#pv"), pvi=pv.querySelector("img"), lb=$("#lb"), lbi=lb.querySelector("img");
const canHover=window.matchMedia("(hover:hover)").matches;
let curP=null;
function showPv(p,x,y){
  if(curP!==p){ curP=p; setImg(pvi,p); }
  pv.style.display="block";
  const w=300,h=w*600/429,m=18;
  let L=x+m,T=y-h/3;
  if(L+w>innerWidth-8) L=x-w-m;
  if(L<8) L=8;
  T=Math.max(8,Math.min(T,innerHeight-h-8));
  pv.style.left=L+"px"; pv.style.top=T+"px";
}
document.addEventListener("mouseover",e=>{ if(!canHover) return; const el=e.target.closest("[data-card]"); if(el) showPv(el.dataset.card,e.clientX,e.clientY); });
document.addEventListener("mousemove",e=>{ if(!canHover||pv.style.display!=="block") return; const el=e.target.closest("[data-card]"); if(el) showPv(el.dataset.card,e.clientX,e.clientY); });
document.addEventListener("mouseout",e=>{ const el=e.target.closest("[data-card]"); if(el&&!(e.relatedTarget&&el.contains(e.relatedTarget))) pv.style.display="none"; });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-card]");
  if(el&&(el.dataset.open||!canHover)){ pv.style.display="none"; setImg(lbi,el.dataset.card); lb.style.display="flex"; }
});
lb.addEventListener("click",()=>lb.style.display="none");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.style.display="none"; });
window.addEventListener("hashchange",()=>{ pv.style.display="none"; route(); });
route();
</script>
</body>
</html>
